# Publish the history as static files, so it outlives the host.
#
# Render suspended this service over an unpaid invoice and every /runs link on
# erikhill.dev went 503. The runs are recorded evidence, not live computation,
# so nothing here needs a server: Actions is free and unlimited on public repos,
# Neon's free plan is permanent, and Pages has no billing to lapse. The export
# is byte-identical to what the API returned, proven by tests/test_export_static.py.
#
# Set the repo secret DATABASE_URL to the Neon connection string. It is passed to
# the exporter through the environment, never echoed, and the manifest records
# the database host only.
name: archive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Publish even if the run count DROPPED (say why in the run notes)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    outputs:
      exported_at: ${{ steps.stamp.outputs.exported_at }}
      runs_sha256: ${{ steps.stamp.outputs.runs_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Export every read route to static JSON
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add the Neon connection string"
            echo "::error::under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Adjacent-within-suite pairs are emitted automatically. This one is
          # named explicitly because erikhill.dev links it directly and the two
          # runs are not necessarily adjacent; without it that published URL
          # would 404 in the archive.
          python tools/export_static.py --out site \
            --pair d800b9a8d3284240bd536bb63fa5f2da:2a95eaada39c453d9920f2ab4fd50391
          test -s site/manifest.json

      # Hand the verify job the identity of THIS export, so it can tell the
      # archive it just published apart from whatever Pages served before.
      - name: Stamp this export
        id: stamp
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          m = json.load(open("site/manifest.json"))
          print(f"exported_at={m['exported_at']}")
          print(f"runs_sha256={m['files']['runs.json']}")
          EOF

      # The guard that matters. A transient database fault, a wrong branch, or a
      # half-migrated schema can all produce a SMALLER archive that exports
      # cleanly and hashes fine. Publishing it would overwrite good evidence with
      # less evidence, silently, and the manifest would look healthy either way.
      # So compare against what is already published and refuse to shrink.
      - name: Refuse to publish fewer runs than are already live
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          new=$(python -c "import json;print(json.load(open('site/manifest.json'))['run_count'])")
          old=$(curl -fsS --max-time 20 https://erikhill.dev/eval-history/manifest.json 2>/dev/null \
                | python -c "import json,sys;print(json.load(sys.stdin)['run_count'])" 2>/dev/null || echo "none")
          echo "published run_count: $old"
          echo "new run_count:       $new"
          if [ "$old" = "none" ]; then
            echo "Nothing published yet; this is the first archive."
          elif [ "$new" -lt "$old" ]; then
            if [ "$ALLOW_SHRINK" = "true" ]; then
              echo "::warning::Run count dropped $old -> $new, publishing anyway by explicit request."
            else
              echo "::error::Run count DROPPED $old -> $new. Refusing to publish a smaller archive."
              echo "::error::Re-run with allow_shrink if runs were deleted on purpose."
              exit 1
            fi
          fi

      - name: A browsable index, so the directory is not a 404
        run: |
          runs=$(python -c "import json;print(json.load(open('site/manifest.json'))['run_count'])")
          when=$(python -c "import json;print(json.load(open('site/manifest.json'))['exported_at'])")
          cat > site/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>eval-history archive</title>
          <style>body{font:16px/1.6 ui-monospace,Menlo,monospace;max-width:46rem;margin:4rem auto;padding:0 1rem;background:#0e1316;color:#dae2e4}
          a{color:#f2a53c}code{color:#9aa7ad}</style>
          <h1>eval-history, archived</h1>
          <p>$runs runs, exported $when. Static copies of the read routes the API served,
          byte-identical to its responses.</p>
          <ul>
            <li><a href="runs.json"><code>runs.json</code></a> every run, newest first</li>
            <li><code>runs/&lt;id&gt;.json</code> one run</li>
            <li><code>runs/&lt;id&gt;/eval_run.json</code> the shape it arrived in</li>
            <li><code>runs/&lt;a&gt;/compare/&lt;b&gt;.json</code> what changed, a is the baseline</li>
            <li><code>suites/&lt;name&gt;/latest-comparison.json</code> newest two CI runs</li>
            <li><a href="manifest.json"><code>manifest.json</code></a> sha256 of every file above</li>
          </ul>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The post-deploy smoke test. It used to live in ci.yml and poll the Render
  # service's /readyz on every push to main, because Render redeployed on push.
  # Render is gone and nothing deploys on push any more, so that job spent ten
  # minutes per push polling a deleted host before failing, and proved nothing.
  #
  # The deploy that matters now is THIS workflow publishing to Pages, so the
  # check belongs here. It asserts two things, and both can go red:
  #   - the manifest being served carries THIS run's exported_at, so a stale
  #     Pages cache or a deploy that silently did not land cannot pass;
  #   - the served runs.json hashes to what the manifest records, so a truncated
  #     or corrupted publish is caught rather than trusted.
  verify:
    needs: [export, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: The published archive is the one this run exported
        env:
          WANT_AT: ${{ needs.export.outputs.exported_at }}
          WANT_SHA: ${{ needs.export.outputs.runs_sha256 }}
        run: |
          base="https://erikhill.dev/eval-history"
          for i in $(seq 1 20); do
            got=$(curl -s --max-time 20 "$base/manifest.json?nocache=$(date +%s)" \
                  | python -c "import json,sys; print(json.load(sys.stdin)['exported_at'])" 2>/dev/null || true)
            if [ "$got" = "$WANT_AT" ]; then
              echo "manifest is live after $i attempt(s): exported_at $got"
              break
            fi
            echo "attempt $i: serving exported_at '${got:-unreadable}', want '$WANT_AT'"
            [ "$i" = 20 ] && { echo "::error::Pages never served this run's manifest"; exit 1; }
            sleep 15
          done
          have=$(curl -s --max-time 30 "$base/runs.json?nocache=$(date +%s)" | sha256sum | cut -d' ' -f1)
          if [ "$have" != "$WANT_SHA" ]; then
            echo "::error::served runs.json hashes to $have, the manifest records $WANT_SHA"
            exit 1
          fi
          echo "runs.json served intact: sha256 $have"
